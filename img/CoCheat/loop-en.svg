<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" role="img">
<rect x="0" y="0" width="1240" height="520" rx="0" fill="#eeeee8"/>
<text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start">The loop has one extra return path</text>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start">A proposer writes questions and pseudo-labels, a solver answers them, and the solver’s performance on new proposals pays the proposer.</text>
<rect x="60" y="150" width="150" height="62" rx="10" fill="#ffffff" stroke="#9d9c96" stroke-width="1.4"/>
<text x="135" y="186" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">Source docs</text>
<rect x="240" y="150" width="190" height="62" rx="10" fill="#ffffff" stroke="#a86b18" stroke-width="1.4"/>
<text x="335" y="178" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">Proposer: questions</text>
<text x="335" y="196" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">and pseudo-labels</text>
<rect x="460" y="150" width="150" height="62" rx="10" fill="#ffffff" stroke="#9d9c96" stroke-width="1.4"/>
<text x="535" y="186" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">Admission</text>
<rect x="640" y="150" width="170" height="62" rx="10" fill="#ffffff" stroke="#315f86" stroke-width="1.4"/>
<text x="725" y="178" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">Main solver</text>
<text x="725" y="196" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">trains</text>
<rect x="840" y="150" width="170" height="62" rx="10" fill="#ffffff" stroke="#315f86" stroke-width="1.4"/>
<text x="925" y="178" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">Answers later</text>
<text x="925" y="196" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">proposals</text>
<rect x="1040" y="150" width="140" height="62" rx="10" fill="#ffffff" stroke="#e05a36" stroke-width="1.4"/>
<text x="1110" y="186" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#151515" text-anchor="middle">Proposer reward</text>
<line x1="214" y1="181" x2="227" y2="181" stroke="rgba(21,21,21,0.24)" stroke-width="1.6"/>
<path d="M 236 181 L 227 185 L 227 177 z" fill="rgba(21,21,21,0.24)"/>
