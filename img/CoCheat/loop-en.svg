<path d="M 636 181 L 627 185 L 627 177 z" fill="rgba(21,21,21,0.24)"/>
<line x1="814" y1="181" x2="827" y2="181" stroke="rgba(21,21,21,0.24)" stroke-width="1.6"/>
<path d="M 836 181 L 827 185 L 827 177 z" fill="rgba(21,21,21,0.24)"/>
<line x1="1014" y1="181" x2="1027" y2="181" stroke="rgba(21,21,21,0.24)" stroke-width="1.6"/>
<path d="M 1036 181 L 1027 185 L 1027 177 z" fill="rgba(21,21,21,0.24)"/>
<line x1="1110" y1="214" x2="1110" y2="246" stroke="#e05a36" stroke-width="1.8"/>
<line x1="1110" y1="246" x2="335" y2="246" stroke="#e05a36" stroke-width="1.8"/>
<line x1="335" y1="246" x2="335" y2="225" stroke="#e05a36" stroke-width="1.8"/>
<path d="M 335 216 L 339 225 L 331 225 z" fill="#e05a36"/>
<text x="600" y="268" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="620" fill="#e05a36" text-anchor="middle">Return path: the same errors get rewarded twice</text>
<rect x="60" y="292" width="560" height="150" rx="10" fill="#f7f6f1" stroke="none" stroke-width="1"/>
<text x="84" y="322" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#151515" text-anchor="start">Three quantities that must be read apart</text>
<rect x="84" y="338" width="12" height="12" rx="3" fill="#315f86" stroke="none" stroke-width="1"/>
<text x="104" y="349" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">A  agreement (internal signal)</text>
<rect x="84" y="364" width="12" height="12" rx="3" fill="#e05a36" stroke="none" stroke-width="1"/>
<text x="104" y="375" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">F  false agreement (agreeing on the same error)</text>
<rect x="84" y="390" width="12" height="12" rx="3" fill="#a86b18" stroke="none" stroke-width="1"/>
<text x="104" y="401" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">L  credit wrongly withheld</text>
<text x="84" y="428" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="620" fill="#e05a36" text-anchor="start">Watching A alone is not enough: rising agreement is not rising correctness.</text>
<text x="680" y="322" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#151515" text-anchor="start">False agreement grows by round</text>
