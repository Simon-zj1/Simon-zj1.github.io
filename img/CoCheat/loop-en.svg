<text x="727" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="middle">4B</text>
<rect x="770" y="425.8" width="54" height="4.2" rx="4" fill="#9d9c96" stroke="none" stroke-width="1"/>
<text x="797" y="417.8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#9d9c96" text-anchor="middle">0.003</text>
<text x="797" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="middle">9B</text>
<rect x="940" y="344.6" width="54" height="85.39999999999999" rx="4" fill="#e05a36" stroke="none" stroke-width="1"/>
<text x="967" y="336.6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#e05a36" text-anchor="middle">0.061</text>
<text x="967" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="middle">4B</text>
<rect x="1010" y="306.8" width="54" height="123.19999999999999" rx="4" fill="#e05a36" stroke="none" stroke-width="1"/>
<text x="1037" y="298.8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#e05a36" text-anchor="middle">0.088</text>
<text x="1037" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="middle">9B</text>
<line x1="680" y1="430" x2="1080" y2="430" stroke="rgba(21,21,21,0.24)" stroke-width="1.4"/>
<text x="725" y="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="middle">Round 1</text>
<text x="975" y="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="middle">Round 3</text>
<text x="60" y="486" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">Source: Figure 1, Sec.2 and Table 4. F is 0.004 (4B) and 0.003 (9B) in round 1, rising to 0.061 and 0.088 by round 3.</text>
</svg>
