<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530" width="1240" height="530" role="img">
<rect x="0" y="0" width="1240" height="530" rx="0" fill="#eeeee8"/>
<text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start">两种干预，两个作用点</text>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start">MSV 管「哪些样本能进训练集」，CrossFit 管「谁来给 proposer 反馈」。</text>
<rect x="60" y="130" width="550" height="330" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="84" y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#315f86" text-anchor="start">MSV 多样本验证（准入时）</text>
<rect x="84" y="188" width="502" height="38" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="102" y="212" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">1. 同一模型，带源采 3 次</text>
<rect x="84" y="234" width="502" height="38" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="102" y="258" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">2. 不带源再采 3 次</text>
<rect x="84" y="280" width="502" height="38" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="102" y="304" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">3. 两个多数都非空且互相匹配才准入</text>
<rect x="84" y="326" width="502" height="38" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="102" y="350" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">4. 兼容多数替换草稿标签</text>
<rect x="84" y="374" width="502" height="32" rx="10" fill="#ffffff" stroke="#a86b18" stroke-width="1.2"/>
<text x="102" y="395" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a86b18" text-anchor="start">代价：每个候选多 6 次生成</text>
<text x="84" y="430" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="620" fill="#666862" text-anchor="start">效果有限：相对 Dr. Zero 只提升 0.7 到 0.8 分</text>
<rect x="630" y="130" width="550" height="330" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="654" y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#e05a36" text-anchor="start">CrossFit 交叉拟合反馈（打分时）</text>
<rect x="654" y="188" width="502" height="34" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="672" y="210" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">1. 源文档按血缘分成两折</text>
<rect x="654" y="230" width="502" height="34" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="672" y="252" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">2. 辅助 Solver 0 只学 fold 0</text>
<rect x="654" y="272" width="502" height="34" rx="10" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="672" y="294" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">3. 辅助 Solver 1 只学 fold 1</text>
<rect x="654" y="314" width="502" height="38" rx="10" fill="#ffffff" stroke="#e05a36" stroke-width="1.4"/>
<text x="672" y="338" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e05a36" text-anchor="start">fold 1 的问题交给 Solver 0 打分，反之亦然</text>
<rect x="654" y="358" width="502" height="32" rx="10" fill="#ffffff" stroke="#315f86" stroke-width="1.2"/>
<text x="672" y="379" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#315f86" text-anchor="start">主 Solver 的训练规则完全不变</text>
<text x="654" y="410" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a86b18" text-anchor="start">代价：预算增加约 72% 与 79%</text>
<text x="654" y="432" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="620" fill="#e05a36" text-anchor="start">效果：相对 Dr. Zero 提升 8.8 与 8.4 分</text>
<text x="60" y="496" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">数据来源：原文 Sec.3.1、Sec.3.2、Figure 2 与 Table 3。CrossFit 的奖励函数沿用 Dr. Zero 的前沿奖励，只替换提供反馈的 solver。</text>
</svg>
