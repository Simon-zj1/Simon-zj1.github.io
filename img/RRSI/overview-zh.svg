<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img">
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#eeeee8"/>
<text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start" opacity="1">RRSI：正则化的是搜索过程，不是编辑空间</text>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start" opacity="1">提案侧控制搜索容量怎么花，选择侧控制哪些增益可以变成永久状态。</text>
<rect x="60" y="130" width="500" height="470" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="88" y="168" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="650" fill="#1f6f68" text-anchor="start" opacity="1">提案侧</text>
<text x="88" y="190" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">控制搜索容量怎么用</text>
<rect x="88" y="210" width="444" height="110" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="88" y="210" width="5" height="110" rx="2.5" fill="#1f6f68" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="112" y="228" width="26" height="26" rx="6" fill="#1f6f68" stroke="none" stroke-width="1"/>
<text x="125" y="246" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">A</text>
<text x="152" y="247" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="620" fill="#151515" text-anchor="start" opacity="1">退火编辑预算</text>
<text x="112" y="276" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">余弦退火，从 b_max 降到 1</text>
<text x="112" y="297" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">越晚的轮次越只能改一处</text>
<rect x="88" y="336" width="444" height="110" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="88" y="336" width="5" height="110" rx="2.5" fill="#1f6f68" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="112" y="354" width="26" height="26" rx="6" fill="#1f6f68" stroke="none" stroke-width="1"/>
<text x="125" y="372" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">B</text>
<text x="152" y="373" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="620" fill="#151515" text-anchor="start" opacity="1">证据感知信用分配</text>
<text x="112" y="402" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">记录每条编辑的组件、假设与结果</text>
<text x="112" y="423" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">被否掉的机制留作负证据</text>
<rect x="88" y="462" width="444" height="110" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="88" y="462" width="5" height="110" rx="2.5" fill="#1f6f68" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="112" y="480" width="26" height="26" rx="6" fill="#1f6f68" stroke="none" stroke-width="1"/>
<text x="125" y="498" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">C</text>
<text x="152" y="499" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="620" fill="#151515" text-anchor="start" opacity="1">结构化探索</text>
<text x="112" y="528" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">停滞时投向从未试过的组件类型</text>
<text x="112" y="549" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">只改变搜索方向，不改变可编辑范围</text>
<rect x="584" y="288" width="76" height="76" rx="38" fill="#ffffff" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="622" y="322" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#e05a36" text-anchor="middle" opacity="1">RS</text>
<text x="622" y="344" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#666862" text-anchor="middle" opacity="1">正则化转移</text>
<text x="622" y="404" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#666862" text-anchor="middle" opacity="1">H′ ~ P_reg(· | H_t)</text>
<rect x="680" y="130" width="500" height="470" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="708" y="168" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="650" fill="#315f86" text-anchor="start" opacity="1">选择侧</text>
<text x="708" y="190" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">控制哪些增益能固化</text>
<rect x="708" y="210" width="444" height="80" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="708" y="210" width="5" height="80" rx="2.5" fill="#315f86" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="732" y="224" width="24" height="24" rx="6" fill="#315f86" stroke="none" stroke-width="1"/>
<text x="744" y="241" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">D</text>
<text x="768" y="242" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="620" fill="#151515" text-anchor="start" opacity="1">泄漏筛查</text>
<text x="732" y="268" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">评测前就拦掉 benchmark 专属逻辑</text>
<text x="732" y="286" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">避免脏候选污染后续历史</text>
<rect x="708" y="304" width="444" height="80" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="708" y="304" width="5" height="80" rx="2.5" fill="#315f86" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="732" y="318" width="24" height="24" rx="6" fill="#315f86" stroke="none" stroke-width="1"/>
<text x="744" y="335" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">E</text>
<text x="768" y="336" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="620" fill="#151515" text-anchor="start" opacity="1">噪声调整下限</text>
<text x="732" y="362" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">分数不得低于历史最好值减 δ</text>
<text x="732" y="380" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">δ 由未改动 harness 重复评测得到</text>
<rect x="708" y="398" width="444" height="80" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="708" y="398" width="5" height="80" rx="2.5" fill="#315f86" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="732" y="412" width="24" height="24" rx="6" fill="#315f86" stroke="none" stroke-width="1"/>
<text x="744" y="429" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">F</text>
<text x="768" y="430" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="620" fill="#151515" text-anchor="start" opacity="1">复杂度感知接受</text>
<text x="732" y="456" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">多花 token 必须换来可测收益</text>
<text x="732" y="474" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">ΔC ≤ β0 + β1 · ΔS</text>
<rect x="708" y="492" width="444" height="80" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="708" y="492" width="5" height="80" rx="2.5" fill="#315f86" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="732" y="506" width="24" height="24" rx="6" fill="#315f86" stroke="none" stroke-width="1"/>
<text x="744" y="523" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">G</text>
<text x="768" y="524" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="620" fill="#151515" text-anchor="start" opacity="1">结构剪枝</text>
<text x="732" y="550" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">窗口内没有正贡献的组件列为删除目标</text>
<text x="732" y="568" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">机制要持续挣得自己的位置</text>
<text x="60" y="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1">七条约束里没有一条限制 harness 能长什么样；它们只改变搜索怎么走。</text>
</svg>
