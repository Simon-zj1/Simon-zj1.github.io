<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540" role="img">
<rect x="0" y="0" width="1240" height="540" rx="0" fill="#eeeee8"/>
<text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start" opacity="1">Agent 系统 = 冻结的 policy + 可编辑的 harness</text>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start" opacity="1">论文优化的是外面这一层：提示、控制流、工具、记忆与上下文管理。</text>
<rect x="60" y="140" width="700" height="300" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="88" y="176" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="620" fill="#151515" text-anchor="start" opacity="1">Agent 系统</text>
<rect x="88" y="198" width="644" height="74" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<rect x="88" y="198" width="6" height="74" rx="3" fill="#666862" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="114" y="232" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1">Backbone policy π（冻结）</text>
<text x="114" y="256" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">全程不更新权重</text>
<rect x="88" y="288" width="644" height="120" rx="10" fill="#ffffff" stroke="#e05a36" stroke-width="1.5"/>
<rect x="88" y="288" width="6" height="120" rx="3" fill="#e05a36" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="114" y="322" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1">Harness H（被演化）</text>
<text x="114" y="346" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1">唯一被优化的部分</text>
<text x="114" y="380" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1">提示 · 控制流 · 工具 · 记忆 · 上下文</text>
<line x1="800" y1="348" x2="848" y2="348" stroke="#e05a36" stroke-width="2"/>
<path d="M 848 341 L 862 348 L 848 355 z" fill="#e05a36"/>
<text x="880" y="176" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="620" fill="#151515" text-anchor="start" opacity="1">H 包含的组件</text>
<rect x="880" y="198" width="300" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="900" y="224" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#151515" text-anchor="start" opacity="1">系统提示 / 任务提示</text>
<rect x="880" y="246" width="300" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="900" y="272" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#151515" text-anchor="start" opacity="1">控制流：规划 · 反思 · 停止</text>
<rect x="880" y="294" width="300" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="900" y="320" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#151515" text-anchor="start" opacity="1">工具接口与描述</text>
<rect x="880" y="342" width="300" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="900" y="368" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#151515" text-anchor="start" opacity="1">记忆与 skill 文件</text>
<rect x="880" y="390" width="300" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="900" y="416" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#151515" text-anchor="start" opacity="1">上下文管理</text>
<text x="60" y="490" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1">这 9 类组件都可以被增加、修改或删除——RRSI 不限制能改什么。</text>
</svg>
