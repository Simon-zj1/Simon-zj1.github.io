<text x="674" y="304" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">ACP protocol</text>
<rect x="674" y="312" width="207.27272727272725" height="16" rx="4" fill="#315f86" stroke="none" stroke-width="1"/>
<text x="889.2727272727273" y="325" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#666862" text-anchor="start">6/11</text>
<text x="674" y="350" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#151515" text-anchor="start">OS-level sandbox</text>
<rect x="674" y="358" width="69.0909090909091" height="16" rx="4" fill="#9d9c96" stroke="none" stroke-width="1"/>
<text x="751.0909090909091" y="371" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#666862" text-anchor="start">2/11</text>
<text x="674" y="396" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#151515" text-anchor="start">What they use instead</text>
