<text x="734" y="422" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">Hand-rolled async loops</text>
<rect x="802" y="408" width="120" height="20" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="862" y="422" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">ripgrep</text>
