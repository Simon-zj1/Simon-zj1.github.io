<text x="990" y="422" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">tree-sitter</text>
<rect x="1058" y="408" width="120" height="20" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="1118" y="422" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">glob</text>
<rect x="674" y="434" width="120" height="20" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="734" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">AGENTS.md / CLAUDE.md</text>
<rect x="802" y="434" width="120" height="20" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="862" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">Policy files</text>
<rect x="930" y="434" width="120" height="20" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="990" y="448" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#666862" text-anchor="middle">SQLite FTS5</text>
<text x="60" y="486" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">Source: Observations 8, 9 (/13.2) and 11. The authors call the finding structurally conservative: internal forks, dynamically imported plugins and transpiled distributions were not traced.</text>
