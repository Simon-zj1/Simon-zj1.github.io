<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" role="img">
<rect x="0" y="0" width="1240" height="740" rx="0" fill="#eeeee8"/>
<text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start">harness 的七个规范子系统</text>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start">从约百行的研究基线到百万行生产 CLI，每个系统都必须对这七件事表态——哪怕表态是刻意缺席。</text>
<rect x="530" y="280" width="180" height="100" rx="12" fill="#151515" stroke="none" stroke-width="1"/>
<text x="620" y="326" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="680" fill="#ffffff" text-anchor="middle">Agent 循环</text>
<text x="620" y="352" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#c9d4df" text-anchor="middle">推理 ↔ 执行</text>
<rect x="170" y="160" width="250" height="64" rx="10" fill="#ffffff" stroke="#315f86" stroke-width="1.3"/>
<text x="188" y="187" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#315f86" text-anchor="start">LLM 集成</text>
<text x="188" y="208" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="start">讲 provider 协议，组装提示，</text>
<rect x="170" y="470" width="250" height="64" rx="10" fill="#ffffff" stroke="#a86b18" stroke-width="1.3"/>
<text x="188" y="497" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#a86b18" text-anchor="start">工具与动作</text>
<text x="188" y="518" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="start">定义并执行 agent 能做的事，首要</text>
<rect x="800" y="160" width="260" height="64" rx="10" fill="#ffffff" stroke="#1f6f68" stroke-width="1.3"/>
<text x="818" y="187" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#1f6f68" text-anchor="start">记忆与上下文</text>
<text x="818" y="208" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="start">配给上下文窗口，跨回合与会话持久知识</text>
<rect x="940" y="320" width="250" height="64" rx="10" fill="#ffffff" stroke="#e05a36" stroke-width="1.3"/>
<text x="958" y="347" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#e05a36" text-anchor="start">安全与权限</text>
<text x="958" y="368" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="start">决定什么能跑、什么要问、什么禁止，并隔</text>
<rect x="800" y="470" width="260" height="64" rx="10" fill="#ffffff" stroke="#315f86" stroke-width="1.3"/>
<text x="818" y="497" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#315f86" text-anchor="start">编排</text>
<text x="818" y="518" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="start">派生并协调子 agent，连接其他 a</text>
<rect x="490" y="500" width="260" height="64" rx="10" fill="#ffffff" stroke="#a86b18" stroke-width="1.3"/>
<text x="508" y="527" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#a86b18" text-anchor="start">扩展性</text>
<text x="508" y="548" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#666862" text-anchor="start">让用户与生态增加能力：配置、hooks</text>
<rect x="60" y="590" width="1120" height="40" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="84" y="616" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#151515" text-anchor="start">接口层：TUI / CLI / IDE / SDK / HTTP 服务</text>
<rect x="60" y="640" width="1120" height="34" rx="10" fill="#f7f6f1" stroke="rgba(21,21,21,0.24)" stroke-width="1"/>
<text x="84" y="663" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#151515" text-anchor="start">会话基底：transcript、持久化、resume/fork</text>
<text x="60" y="706" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">数据来源：原文 Sec.2.3、Figure 1 与 Table 1，按原图重绘。另有两个横切面与七个子系统并列。</text>
</svg>
