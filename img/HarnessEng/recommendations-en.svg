<text x="452" y="411" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#666862" text-anchor="start">10</text>
<text x="474" y="411" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">OS sandboxing and policy-as-co</text>
<rect x="820" y="386" width="360" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="832" y="411" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#666862" text-anchor="start">11</text>
<text x="854" y="411" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">Codify safety as data, keep a </text>
<text x="60" y="456" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="680" fill="#315f86" text-anchor="start">Orchestration and protocols</text>
<rect x="60" y="466" width="360" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="72" y="491" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#666862" text-anchor="start">12</text>
<text x="94" y="491" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">Stay single-agent first</text>
<rect x="440" y="466" width="360" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="452" y="491" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#666862" text-anchor="start">13</text>
<text x="474" y="491" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">Ship an ACP server; keep sub-a</text>
<text x="60" y="536" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="680" fill="#e05a36" text-anchor="start">Extensibility and red lines</text>
