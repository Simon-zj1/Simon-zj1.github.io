<text x="60" y="216" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="680" fill="#a86b18" text-anchor="start">Tool design</text>
