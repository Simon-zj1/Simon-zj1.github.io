<text x="94" y="411" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">Three-mode approval for develo</text>
