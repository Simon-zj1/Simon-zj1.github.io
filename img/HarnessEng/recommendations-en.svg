<text x="72" y="251" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#666862" text-anchor="start">3</text>
<text x="94" y="251" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">Start with bash only; add tool</text>
