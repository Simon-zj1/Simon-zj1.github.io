<text x="832" y="331" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#e05a36" text-anchor="start">8</text>
<text x="854" y="331" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#151515" text-anchor="start">不要为代码建 RAG</text>
