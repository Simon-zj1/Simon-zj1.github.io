<text x="452" y="571" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#e05a36" text-anchor="start">15</text>
<text x="474" y="571" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#151515" text-anchor="start">运行时不要用通用 agent 框架</text>
