<text x="474" y="331" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">阈值压缩 + 逐字尾部 + 增量合并</text>
