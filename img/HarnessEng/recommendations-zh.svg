<text x="94" y="621" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">不要把上游 API 一对一包成工具</text>
<rect x="440" y="596" width="360" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
<text x="452" y="621" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#666862" text-anchor="start">18</text>
<text x="474" y="621" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">不要过度设计卡死检测，但装上便宜的上限</text>
<text x="60" y="680" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#666862" text-anchor="start">数据来源：原文 Sec.16。红框条目是与「行业常态」相反的红线式建议（不要为代码建 RAG、不要在运行时用通用框架）。</text>
