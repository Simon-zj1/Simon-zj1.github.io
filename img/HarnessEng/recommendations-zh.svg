<text x="474" y="171" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="520" fill="#151515" text-anchor="start">按是否自研模型决定 provider 耦合</text>
<text x="60" y="216" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="680" fill="#a86b18" text-anchor="start">工具设计</text>
