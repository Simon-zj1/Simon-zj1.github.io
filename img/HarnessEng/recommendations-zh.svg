<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 724" width="1240" height="724" role="img">
<rect x="0" y="0" width="1240" height="724" rx="0" fill="#eeeee8"/>
<text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start">18 条设计建议，按子系统分组</text>
<text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start">每条都锚定到具体观察与被观测到的系统实现；论文另给一个 90 行骨架直接实现其中 10 条。</text>
<text x="60" y="136" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="680" fill="#315f86" text-anchor="start">循环与耦合</text>
