<text x="832" y="571" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#e05a36" text-anchor="start">16</text>
<text x="854" y="571" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="620" fill="#151515" text-anchor="start">不要为代码建向量检索层</text>
<rect x="60" y="596" width="360" height="40" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1"/>
