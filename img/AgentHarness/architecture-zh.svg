<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666862"/></marker></defs><rect x="0" y="0" width="1240" height="720" rx="0" fill="#eeeee8" stroke="none" stroke-width="1.0"/><text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start" opacity="1.0">本地 Agent Harness · 五层结构</text><text x="60" y="94" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">记忆、权限、触发、验收归自己；模型与重活外包给可替换的执行器。</text><rect x="60" y="130" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="130" width="6" height="84" rx="3" fill="#e05a36" stroke="none" stroke-width="1.0"/><text x="88" y="164" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">触发与验收</text><text x="88" y="190" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">定时/事件唤醒；四项校验不过就不发布；运行全部入台账</text><rect x="60" y="226" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="226" width="6" height="84" rx="3" fill="#a86b18" stroke="none" stroke-width="1.0"/><text x="88" y="260" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">任务与编排</text><text x="88" y="286" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">任务声明式描述（步骤/工具白名单/可写路径/预算/降级策略）</text><rect x="60" y="322" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="322" width="6" height="84" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="88" y="356" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">工具与权限</text><text x="88" y="382" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">文件/命令/网络/通知都走统一接口，越权直接拒绝，调用可审计</text><rect x="60" y="418" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="418" width="6" height="84" rx="3" fill="#1f6f68" stroke="none" stroke-width="1.0"/><text x="88" y="452" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">记忆</text><text x="88" y="478" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">事实自动写入 runs/，结论由人确认后写入 notes/，本机可审计</text><rect x="60" y="514" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="514" width="6" height="84" rx="3" fill="#666862" stroke="none" stroke-width="1.0"/><text x="88" y="548" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">模型适配</text><text x="88" y="574" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">provider 接口统一，云端模型为主，本地模型留同一接口</text><rect x="880" y="130" width="300" height="180" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="904" y="164" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">可替换执行器</text><text x="904" y="196" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· Codex CLI</text><text x="904" y="222" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· Claude Code</text><text x="904" y="248" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· DeepSeek API</text><text x="904" y="274" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· 本地模型 / Local</text><rect x="880" y="322" width="300" height="84" rx="10" fill="#f4d9cf" stroke="none" stroke-width="1.0"/><text x="904" y="356" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#8c3a1f" text-anchor="start" opacity="1.0">无人值守触发</text><text x="904" y="382" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8c3a1f" text-anchor="start" opacity="1.0">launchd / 定时 / 事件</text><rect x="880" y="418" width="300" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="904" y="452" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">全部留在本机</text><text x="904" y="478" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">memory/ · runs/ · 配置</text><rect x="60" y="616" width="1120" height="62" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="84" y="654" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">与直接用通用 Coding Agent 的差别：会话与记忆归自己、能被定时唤醒、带自己的凭据与产物契约、验收标准写在代码里。</text></svg>
