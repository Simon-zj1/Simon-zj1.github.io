<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666862"/></marker></defs><rect x="0" y="0" width="1240" height="720" rx="0" fill="#eeeee8" stroke="none" stroke-width="1.0"/><text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start" opacity="1.0">Local Agent Harness · Five layers</text><text x="60" y="94" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">You own memory, permissions, triggers and acceptance; models and heavy lifting are swappable.</text><rect x="60" y="130" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="130" width="6" height="84" rx="3" fill="#e05a36" stroke="none" stroke-width="1.0"/><text x="88" y="164" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Triggers &amp; acceptance</text><text x="88" y="190" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">Scheduled or event wake-ups; four gates must pass; every run is ledgered</text><rect x="60" y="226" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="226" width="6" height="84" rx="3" fill="#a86b18" stroke="none" stroke-width="1.0"/><text x="88" y="260" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Tasks &amp; orchestration</text><text x="88" y="286" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">Declarative tasks: steps, tool allow-list, writable paths, budget, degradation</text><rect x="60" y="322" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="322" width="6" height="84" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="88" y="356" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Tools &amp; permissions</text><text x="88" y="382" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">Files, shell, HTTP and notifications behind one interface; out-of-scope writes are refused</text><rect x="60" y="418" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="418" width="6" height="84" rx="3" fill="#1f6f68" stroke="none" stroke-width="1.0"/><text x="88" y="452" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Memory</text><text x="88" y="478" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">Facts land in runs/ automatically; conclusions need human confirmation in notes/</text><rect x="60" y="514" width="780" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="514" width="6" height="84" rx="3" fill="#666862" stroke="none" stroke-width="1.0"/><text x="88" y="548" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Model adapters</text><text x="88" y="574" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">One provider interface: cloud models by default, a local endpoint slots in</text><rect x="880" y="130" width="300" height="180" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="904" y="164" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Swappable executors</text><text x="904" y="196" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· Codex CLI</text><text x="904" y="222" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· Claude Code</text><text x="904" y="248" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· DeepSeek API</text><text x="904" y="274" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">· 本地模型 / Local</text><rect x="880" y="322" width="300" height="84" rx="10" fill="#f4d9cf" stroke="none" stroke-width="1.0"/><text x="904" y="356" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#8c3a1f" text-anchor="start" opacity="1.0">Unattended trigger</text><text x="904" y="382" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8c3a1f" text-anchor="start" opacity="1.0">launchd / schedule / events</text><rect x="880" y="418" width="300" height="84" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="904" y="452" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">Everything stays local</text><text x="904" y="478" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">memory/ · runs/ · config</text><rect x="60" y="616" width="1120" height="62" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="84" y="654" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">How it differs from driving a general coding agent: you own the sessions and memory, it can wake itself up, it holds your credentials and output contract, and acceptance lives in code.</text></svg>
