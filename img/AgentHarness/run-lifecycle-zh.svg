<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666862"/></marker></defs><rect x="0" y="0" width="1240" height="600" rx="0" fill="#eeeee8" stroke="none" stroke-width="1.0"/><text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="650" fill="#151515" text-anchor="start" opacity="1.0">一次无人值守运行</text><text x="60" y="94" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">从定时唤醒到产物上线，中途任何一步降级都会被记录，而不是悄悄糊过去。</text><rect x="60" y="140" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="140" width="250" height="5" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="82" y="182" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">01</text><text x="82" y="216" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">launchd 23:00</text><text x="82" y="246" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">定时唤醒</text><line x1="314" y1="214.0" x2="332" y2="214.0" stroke="rgba(21,21,21,0.12)" stroke-width="1.0" marker-end="url(#arrow)"/><rect x="336" y="140" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="336" y="140" width="250" height="5" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="358" y="182" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">02</text><text x="358" y="216" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">任务锁</text><text x="358" y="246" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">同任务只跑一个</text><line x1="590" y1="214.0" x2="608" y2="214.0" stroke="rgba(21,21,21,0.12)" stroke-width="1.0" marker-end="url(#arrow)"/><rect x="612" y="140" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="612" y="140" width="250" height="5" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="634" y="182" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">03</text><text x="634" y="216" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">抓取当日数据</text><text x="634" y="246" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">代理/额度不可用则降级</text><line x1="866" y1="214.0" x2="884" y2="214.0" stroke="rgba(21,21,21,0.12)" stroke-width="1.0" marker-end="url(#arrow)"/><rect x="888" y="140" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="888" y="140" width="250" height="5" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="910" y="182" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">04</text><text x="910" y="216" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">分片撰写</text><text x="910" y="246" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">6 次调用 + 合并</text><rect x="60" y="362" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="60" y="362" width="250" height="5" rx="3" fill="#315f86" stroke="none" stroke-width="1.0"/><text x="82" y="404" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">05</text><text x="82" y="438" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">渲染页面</text><text x="82" y="468" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">dry-run 只出预览</text><line x1="314" y1="436.0" x2="332" y2="436.0" stroke="rgba(21,21,21,0.12)" stroke-width="1.0" marker-end="url(#arrow)"/><rect x="336" y="362" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="336" y="362" width="250" height="5" rx="3" fill="#1f6f68" stroke="none" stroke-width="1.0"/><text x="358" y="404" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">06</text><text x="358" y="438" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">四项校验</text><text x="358" y="468" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">不过就不发布</text><line x1="590" y1="436.0" x2="608" y2="436.0" stroke="rgba(21,21,21,0.12)" stroke-width="1.0" marker-end="url(#arrow)"/><rect x="612" y="362" width="250" height="148" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><rect x="612" y="362" width="250" height="5" rx="3" fill="#e05a36" stroke="none" stroke-width="1.0"/><text x="634" y="404" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">07</text><text x="634" y="438" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">发布 + 记忆 + 通知</text><text x="634" y="468" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">推送、写台账、写记忆</text><path d="M 1013.0 292 L 1013.0 322 L 185.0 322 L 185.0 358" fill="none" stroke="#666862" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="60" y="520" width="1120" height="60" rx="10" fill="#ffffff" stroke="rgba(21,21,21,0.12)" stroke-width="1.0"/><text x="84" y="546" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#151515" text-anchor="start" opacity="1.0">降级路径</text><text x="84" y="568" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#666862" text-anchor="start" opacity="1.0">代理不可用 / X 额度耗尽 → 沿用已有数据继续跑并标记 degraded；校验不过或推送失败 → 判失败并通知，绝不发半成品。</text></svg>
